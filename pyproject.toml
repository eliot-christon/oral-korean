[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oral-korean"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oral_korean"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs)
    "SIM", # simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^\\.venv/", "^frontend/"]

[tool.pylint.main]
py-version = "3.12"
ignore = [".venv", ".git", "frontend"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
]
